name: Homebrew tap

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose tarball the formula installs, such as v0.1.0
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose tarball the formula installs, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    name: Update the formula for ${{ inputs.tag }}
    # macOS runner images force-link Homebrew's node@<version>, whose bin/node blocks linking the node dependency.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mahata/homebrew-tap
          path: homebrew-tap
          # Credentials stay persisted so the last step can push with the deploy key.
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Render the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          current=$(sed -n 's|^  url ".*/releases/download/v\([^/]*\)/.*|\1|p' homebrew-tap/Formula/copilotview.rb 2>/dev/null || true)
          if [ -n "$current" ] && [ "$(printf '%s\n' "$current" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "::error::The tap already has copilotview $current, which is newer than $version."
            exit 1
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "copilotview-$version.tar.gz.sha256" --dir "$RUNNER_TEMP"
          read -r sha256 _ < "$RUNNER_TEMP/copilotview-$version.tar.gz.sha256"
          node scripts/homebrew-formula.mjs "$version" "$sha256" > homebrew-tap/Formula/copilotview.rb
      - name: Commit the formula
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/copilotview.rb
          if git diff --cached --quiet; then
            echo "The formula is already up to date."
          else
            git commit -m "copilotview ${RELEASE_TAG#v}"
          fi
      - name: Install, test and audit the formula
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap mahata/tap "$GITHUB_WORKSPACE/homebrew-tap"
          brew install mahata/tap/copilotview
          brew test mahata/tap/copilotview
          brew audit --strict mahata/tap/copilotview
      - name: Push the formula
        working-directory: homebrew-tap
        run: git push origin HEAD:main
