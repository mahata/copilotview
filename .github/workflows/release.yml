name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# One group per ref: runs for main queue up so each sees the tags earlier runs created, and a newer
# main run never replaces a pending run for a manually pushed tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - name: Pick the next minor version
        id: next
        if: github.ref_type == 'branch'
        shell: bash
        run: git tag --list 'v*' | node scripts/next-release-tag.mjs >> "$GITHUB_OUTPUT"
      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.next.outputs.previous-tag }}
          NEXT_TAG: ${{ steps.next.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -z "$PREVIOUS_TAG" ]; then
            tag="$NEXT_TAG"
          else
            previous="copilotview-${PREVIOUS_TAG#v}"
            gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$previous.tar.gz" --dir "$RUNNER_TEMP"
            tar -xzf "$RUNNER_TEMP/$previous.tar.gz" -C "$RUNNER_TEMP"
            if diff -rq dist/cli.js "$RUNNER_TEMP/$previous/cli.js" && diff -rq dist/web "$RUNNER_TEMP/$previous/web"; then
              echo "::notice::The bundled CLI and web UI are unchanged since $PREVIOUS_TAG, so there is nothing to release."
              exit 0
            fi
            tag="$NEXT_TAG"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - if: steps.decide.outputs.tag != ''
        run: pnpm run package
      - name: Smoke-test the packaged CLI
        if: steps.decide.outputs.tag != ''
        run: |
          tar -xzf "release/copilotview-${RELEASE_TAG#v}.tar.gz" -C "$RUNNER_TEMP"
          scripts/smoke-test.sh "$RUNNER_TEMP/copilotview-${RELEASE_TAG#v}/cli.js"
      - name: Publish the GitHub Release
        if: steps.decide.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes

  homebrew:
    name: Homebrew tap
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/homebrew-tap.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
