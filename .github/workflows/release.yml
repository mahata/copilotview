name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# One group per ref: runs for main queue up so each sees the tags earlier runs created, and a newer
# main run never replaces a pending run for a manually pushed tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - name: Pick the next minor version
        id: next
        if: github.ref_type == 'branch'
        shell: bash
        run: git tag --list 'v*' | node scripts/next-release-tag.mjs >> "$GITHUB_OUTPUT"
      - name: Decide whether to release
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.next.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            # A rerun of an older commit must not release it over newer code.
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo "::notice::$GITHUB_REF_NAME has moved on to $head, so the run for that commit decides what to release."
              exit 0
            fi
            # Compare with the newest published release rather than the newest tag, whose release may still be
            # running or may have failed.
            # shellcheck disable=SC2016 # $tag is a jq variable.
            baseline=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '
              .[]
              | select(.draft == false and .prerelease == false)
              | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
              | .tag_name as $tag
              | select(any(.assets[]; .state == "uploaded" and .name == "copilotview-\($tag | ltrimstr("v")).tar.gz"))
              | $tag' | sort -V | tail -n 1)
            if [ -n "$baseline" ]; then
              previous="copilotview-${baseline#v}"
              gh release download "$baseline" --repo "$GITHUB_REPOSITORY" --pattern "$previous.tar.gz" --dir "$RUNNER_TEMP"
              tar -xzf "$RUNNER_TEMP/$previous.tar.gz" -C "$RUNNER_TEMP"
              if diff -rq dist/cli.js "$RUNNER_TEMP/$previous/cli.js" && diff -rq dist/web "$RUNNER_TEMP/$previous/web"; then
                echo "::notice::The bundled CLI and web UI are unchanged since $baseline, so there is nothing to release."
                exit 0
              fi
            fi
            tag="$NEXT_TAG"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - if: steps.decide.outputs.tag != ''
        run: pnpm run package
      - name: Smoke-test the packaged CLI
        if: steps.decide.outputs.tag != ''
        run: |
          tar -xzf "release/copilotview-${RELEASE_TAG#v}.tar.gz" -C "$RUNNER_TEMP"
          scripts/smoke-test.sh "$RUNNER_TEMP/copilotview-${RELEASE_TAG#v}/cli.js"
      - name: Reserve the tag
        if: steps.decide.outputs.tag != '' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh release create would silently reuse a tag pushed during this run; creating the ref fails instead.
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" --silent; then
            echo "::error::Could not create $RELEASE_TAG at $GITHUB_SHA. If someone pushed that tag during this run, re-run this workflow to release the next version."
            exit 1
          fi
      - name: Publish the GitHub Release
        if: steps.decide.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes --verify-tag

  homebrew:
    name: Homebrew tap
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/homebrew-tap.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
